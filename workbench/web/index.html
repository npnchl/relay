<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay A/B Workbench</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <h1>Relay A/B Workbench</h1>
  <span id="conn" class="conn" role="status" aria-live="polite"></span>
  <label class="switch as-all" title="Auto scroll both viewports to the newest line">
    <input type="checkbox" id="autoscroll-all" checked aria-label="Auto scroll both viewports">
    <span class="knob"></span><span class="as-txt">auto-scroll</span>
  </label>
  <div class="source">
    <label for="source">Audio</label>
    <select id="source" aria-label="Audio source"></select>
    <button id="shuffle" class="icon-btn" aria-label="Shuffle segment" title="Shuffle segment" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.8-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
    </button>
  </div>
</header>

<section class="transport" aria-label="Audio transport">
  <button id="play" class="icon-btn big" aria-label="Play">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
  </button>
  <input id="scrub" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek">
  <span id="time" class="time">00:00 / 00:00</span>
</section>

<main class="panels">
  <section class="panel" id="panel-A" aria-label="Model A viewport"></section>
  <section class="panel" id="panel-B" aria-label="Model B viewport"></section>
</main>

<script type="module" src="/static/app.js"></script>
</body>
</html>
