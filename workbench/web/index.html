<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay A/B Workbench</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <h1>Relay A/B</h1>
  <div class="source">
    <label for="source">Source</label>
    <select id="source" aria-label="Audio source"></select>
    <button id="shuffle" class="btn" title="Random 60 s segment">Random</button>
  </div>
  <span class="conn-dot" id="conn-dot" data-state="off" role="status" aria-label="connection: disconnected" title="disconnected"></span>
</header>

<main class="panels">
  <section class="panel" id="panel-A" aria-label="Model A panel"></section>
  <section class="panel" id="panel-B" aria-label="Model B panel"></section>
</main>

<footer class="dock" aria-label="Players">
  <div class="player" id="source-player">
    <span class="plabel" title="The audio file you hear - source of truth, unsynced from the sim">Source</span>
    <button id="src-play" class="icon-btn big" aria-label="Play source audio">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <input id="src-scrub" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek source audio">
    <span id="src-time" class="time">00:00 / 00:00</span>
    <span id="src-status" class="pstatus" role="status"></span>
  </div>
  <div class="player" id="sim-player">
    <span class="plabel" title="The simulated mic - what the models hear">Sim</span>
    <button id="sim-play" class="icon-btn big" aria-label="Start simulated mic">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <input id="sim-scrub" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek simulated mic position">
    <span id="sim-time" class="time">00:00 / 00:00</span>
    <span id="sim-status" class="pstatus" role="status"></span>
  </div>
</footer>

<script type="module" src="/static/app.js"></script>
</body>
</html>
