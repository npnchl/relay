<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay A/B Workbench</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <h1>Relay A/B</h1>
  <span class="conn" id="conn" data-state="off" role="status"><span class="conn-dot" aria-hidden="true"></span><span id="conn-text">connecting…</span></span>
  <div class="source">
    <label for="source">Source</label>
    <select id="source" aria-label="Audio source"></select>
    <button id="shuffle" class="btn" title="Random 60 s segment">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.8-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg>
      Random
    </button>
  </div>
</header>

<main class="panels">
  <section class="panel" id="panel-A" aria-label="Model A panel"></section>
  <section class="panel" id="panel-B" aria-label="Model B panel"></section>
</main>

<footer class="dock" aria-label="Players">
  <div class="pcard" id="source-player">
    <div class="prow-top"><span class="plabel">Source</span><span class="pstatus" id="src-status" role="status"></span><span class="pstatus ok" id="src-suppress" hidden>suppressing</span></div>
    <div class="prow-mid">
      <button id="src-play" class="btn" aria-label="Play/pause source audio"></button>
      <input id="src-scrub" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek source audio">
      <span id="src-time" class="time">00:00 / 00:00</span>
    </div>
  </div>
  <div class="pcard" id="sim-player">
    <div class="prow-top"><span class="plabel">Sim</span><span class="pstatus" id="sim-status" role="status"></span>
      <button id="sim-suppress" class="btn" aria-pressed="false" title="Noise suppression: filters the source player audio and flags the sim stream (sim-side DSP pending)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h3l2-7 4 14 2-7h7"/></svg>
        <span>Suppress</span>
      </button>
    </div>
    <div class="prow-mid">
      <button id="sim-play" class="btn" aria-label="Start/stop simulated mic"></button>
      <input id="sim-scrub" type="range" min="0" max="0" step="0.1" value="0" aria-label="Seek simulated mic position">
      <span id="sim-time" class="time">00:00 / 00:00</span>
    </div>
  </div>
</footer>

<script type="module" src="/static/app.js"></script>
</body>
</html>
