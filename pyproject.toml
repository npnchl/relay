[project]
name = "transcription-accuracy"
version = "0.1.0"
description = "Latency vs accuracy comparison for streaming transcription contenders"
requires-python = ">=3.13,<3.15"
dependencies = [
    "mlx-audio>=0.6",
    "numpy>=2.0",
    "websockets>=17.3",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
]

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.13"
